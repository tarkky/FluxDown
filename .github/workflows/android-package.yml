# 原生 Android App（mobile/Android，applicationId com.fluxdown.app）→ release 签名 APK（universal + 各 ABI）。
# 流程与本机一致，全部在 mobile/Android/scripts/package.sh：
#   cargo-ndk 交叉编译 fluxdown_mobile（release）→ :app:assembleRelease（ABI 拆包 + universal）→ apksigner 校验。
# 只出 artifact，不发 Release、不随 v* tag 触发；release.yml 共用 package.sh 与同一套原生签名发布正式 APK。
# 触发：
#   - 手动：gh workflow run android-package.yml --ref main -f version=X.Y.Z[-后缀]
#   - 被 test-package.yml（target=android-native / all）以 workflow_call 复用，可指定构建 ref。
# 签名用 ANDROID_NATIVE_*，与旧 Flutter APK 的密钥不同，不能互相覆盖安装；缺少签名配置即失败。
# Secrets：ANDROID_NATIVE_KEYSTORE_BASE64 / ANDROID_NATIVE_KEYSTORE_PASSWORD / ANDROID_NATIVE_KEY_ALIAS /
#          ANDROID_NATIVE_KEY_PASSWORD / FLUXCLOUD_BASE_URL（可选）。凭据说明见 .omp/knowledge/ops.md「原生 Android 打包」。
name: Android Native Package
run-name: Android Native Package ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName（X.Y.Z 或 X.Y.Z-后缀；versionCode 由 X.Y.Z 派生）"
        required: true
        type: string
      abis:
        description: "逗号分隔的 ABI"
        required: false
        default: "arm64-v8a,x86_64"
        type: string
  workflow_call:
    inputs:
      ref:
        description: "构建的 git ref（留空 = 调用方的提交）"
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      abis:
        required: false
        default: "arm64-v8a,x86_64"
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build signed APKs
    # cargo-ndk 预编译包要求 GLIBC 2.39（见 ci.yml android job），须 ≥ ubuntu-24.04。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve targets
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ABIS: ${{ inputs.abis }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号须为 X.Y.Z 或 X.Y.Z-后缀（得到 '$INPUT_VERSION'）"
            exit 1
          fi
          TRIPLES=""
          IFS=',' read -ra ABI_LIST <<< "$(tr -d '[:space:]' <<< "$INPUT_ABIS")"
          for abi in "${ABI_LIST[@]}"; do
            case "$abi" in
              arm64-v8a) t=aarch64-linux-android ;;
              armeabi-v7a) t=armv7-linux-androideabi ;;
              x86_64) t=x86_64-linux-android ;;
              x86) t=i686-linux-android ;;
              *) echo "::error::不支持的 ABI '$abi'"; exit 1 ;;
            esac
            TRIPLES="${TRIPLES:+$TRIPLES,}$t"
          done
          {
            echo "version=$INPUT_VERSION"
            echo "abis=$(tr -d '[:space:]' <<< "$INPUT_ABIS")"
            echo "triples=$TRIPLES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.meta.outputs.triples }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-package
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Decode signing keystore
        env:
          ANDROID_NATIVE_KEYSTORE_BASE64: ${{ secrets.ANDROID_NATIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_NATIVE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_NATIVE_KEYSTORE_BASE64 未配置"
            exit 1
          fi
          umask 077
          echo "$ANDROID_NATIVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # NDK：runner 预装于 $ANDROID_HOME/ndk/<版本>，:bridge 自动取最高版本。
      - name: Build, sign and verify
        env:
          FLUXDOWN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NATIVE_KEYSTORE_PASSWORD }}
          FLUXDOWN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_NATIVE_KEY_ALIAS }}
          FLUXDOWN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_NATIVE_KEY_PASSWORD }}
          FLUXCLOUD_BASE_URL: ${{ secrets.FLUXCLOUD_BASE_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
          ABIS: ${{ steps.meta.outputs.abis }}
        run: |
          FLUXDOWN_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" \
            mobile/Android/scripts/package.sh --version "$VERSION" --abis "$ABIS" --out "$RUNNER_TEMP/apk"
          {
            echo "### Android native ${VERSION}"
            echo '```'
            cat "$RUNNER_TEMP/apk/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ steps.meta.outputs.version }}
          path: |
            ${{ runner.temp }}/apk/*.apk
            ${{ runner.temp }}/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
