# ── GPUI 桌面客户端调试包（手动触发，不发 Release）──
# 产出 fluxdown-desktop + fluxdown-agent + fluxdownd 三个同级可执行文件的压缩包，
# 供在真实 Windows / Linux / macOS 机器上调试 GPUI 客户端。server 与移动端不在此流程内，
# 原生 Android / iOS 测试包见 test-package.yml。
#
# 为什么不提供 debug profile：gpui_windows 在 debug_assertions 下运行时从
# env!("CARGO_MANIFEST_DIR") 读取 shaders.hlsl，该路径是构建机的绝对路径，
# 换一台 Windows 机器就找不到着色器。这里始终用 release profile（着色器由 fxc
# 预编译进二进制），只通过 CARGO_PROFILE_RELEASE_* 调整编译速度与调试符号。
name: GPUI Debug Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, tag, or commit to build
        required: true
        default: main
        type: string
      platform:
        description: Target platform
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      arch:
        description: Target architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - all
      build_mode:
        description: "fast = 无 LTO + 保留符号（编译快、可回溯）；shipping = 与正式发布相同的 release profile"
        required: true
        default: fast
        type: choice
        options:
          - fast
          - shipping

permissions:
  contents: read

jobs:
  plan:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Filter matrix by inputs
        id: matrix
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          all='[
            {"platform":"windows","arch":"x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"platform":"windows","arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"},
            {"platform":"linux","arch":"x64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
            {"platform":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"platform":"macos","arch":"x64","runner":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"platform":"macos","arch":"arm64","runner":"macos-15","target":"aarch64-apple-darwin"}
          ]'
          selected=$(jq -c --arg p "$PLATFORM" --arg a "$ARCH" \
            '[.[] | select(($p == "all" or .platform == $p) and ($a == "all" or .arch == $a))]' <<<"$all")
          if [ "$selected" = "[]" ]; then
            echo "::error::No build target matches platform=$PLATFORM arch=$ARCH"
            exit 1
          fi
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  build:
    name: GPUI ${{ matrix.platform }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libzstd-dev libdbus-1-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-debug-${{ matrix.target }}-${{ inputs.build_mode }}
          cache-on-failure: true

      # fast：保留 release 的 debug_assertions=false（Windows 着色器预编译依赖它），
      # 只关掉 fat LTO / 单 codegen unit 并保留行号符号，便于崩溃回溯。
      - name: Configure fast build profile
        if: inputs.build_mode == 'fast'
        shell: bash
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=off"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=2"
            echo "CARGO_PROFILE_RELEASE_STRIP=none"
            echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"

      # agent 在 release 下不允许运行期改 FluxCloud 地址，只认运行期 env > 编译期 env > 127.0.0.1:8720。
      # secret 为空时不导出：option_env! 会把空串当成有效地址。
      - name: Inject FluxCloud endpoint
        shell: bash
        env:
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then
            echo "FLUXCLOUD_BASE_URL=$FLUXCLOUD_BASE_URL_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::secrets.FLUXCLOUD_BASE_URL 未配置，agent 默认连接 http://127.0.0.1:8720"
          fi

      # agent 带 desktop feature：托盘（tao + tray-icon）与剪贴板监听；Linux 运行期需要
      # GTK3 与 (ayatana-)appindicator，构建依赖已在上方安装。
      - name: Build desktop, agent and daemon
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }} \
            -p fluxdown_ui_app -p fluxdown_agent -p fluxdown_daemon \
            --features fluxdown_agent/desktop --bins

      - name: Stage package directory
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          NAME="FluxDown-GPUI-${{ matrix.platform }}-${{ matrix.arch }}-${SHORT_SHA}-${{ inputs.build_mode }}"
          OUT="target/${{ matrix.target }}/release"
          EXE=""
          if [ "${{ matrix.platform }}" = "windows" ]; then EXE=".exe"; fi
          mkdir -p "dist/$NAME"
          # 三个进程必须同目录：desktop 按 current_exe 同级拉起 agent，agent 再拉起 fluxdownd。
          for bin in fluxdown-desktop fluxdown-agent fluxdownd; do
            cp "$OUT/$bin$EXE" "dist/$NAME/"
            if [ "${{ matrix.platform }}" = "windows" ] && [ -f "$OUT/${bin//-/_}.pdb" ]; then
              cp "$OUT/${bin//-/_}.pdb" "dist/$NAME/"
            fi
            if [ "${{ matrix.platform }}" = "macos" ] && [ -d "$OUT/$bin.dSYM" ]; then
              cp -R "$OUT/$bin.dSYM" "dist/$NAME/"
            fi
          done
          cat > "dist/$NAME/BUILD_INFO.txt" <<EOF
          ref: ${{ inputs.ref }}
          commit: $(git rev-parse HEAD)
          target: ${{ matrix.target }}
          build_mode: ${{ inputs.build_mode }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Bundle MSVC CRT
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dest = "dist\${{ steps.stage.outputs.name }}"
          $archDir = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\$archDir\Microsoft.VC1*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "MSVC CRT redist for $archDir not found under $vsRoot" }
          Copy-Item "$($crtDir.FullName)\msvcp140*.dll", "$($crtDir.FullName)\vcruntime140*.dll" $dest -Force
          if (-not (Test-Path "$dest\vcruntime140.dll")) { throw "vcruntime140.dll missing after CRT copy" }

      # Windows 用 zip；Linux/macOS 用 tar.gz 保留可执行位（upload-artifact 的 zip 会丢权限位）。
      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = "${{ steps.stage.outputs.name }}"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

      - name: Archive (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: tar -C dist -czf "dist/${{ steps.stage.outputs.name }}.tar.gz" "${{ steps.stage.outputs.name }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
