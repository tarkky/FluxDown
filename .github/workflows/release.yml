name: Release

# ── 统一发布：一个 vX.Y.Z（预览 vX.Y.Z-rc.N）GitHub Release 承载本次全部组件 ──
# 流程：changes（变更检测 + 源码解析）→ prepare-release（生成双语说明、建草稿 release）
#       → 各 build-* 并行构建 → upload-<组件>（上传产物 + SHA256SUMS-<组件>.txt 完成哨兵，
#       同步 OSS）→ publish-release（汇总校验和、刷新说明头部、草稿转正、决定 latest）。
# 组件之间互不阻断：某组件打包失败只让它自己的 upload 被跳过，其余组件照常发布；
# 官网 /api/release 只认有完成哨兵的组件，缺失组件自动回落到它上一个完整版本。
# 补救：
#   - 偶发失败（源码无需改动）：本次运行页 “Re-run failed jobs”，只重跑失败组件与收尾 job。
#   - 需要改代码 / 改打包脚本：修复合入发布分支后 workflow_dispatch 补发该组件，
#     source_ref 指向包含修复的分支或提交；产物以原 tag 的版本号上传到同一个 release。
# 演练（rehearsal=true，仅手动触发）：以「尚不存在」的 tag 跑完整条流水线——分支守卫、变更检测、
#   引擎门禁、全部构建 / 签名 / 公证 / 打包、发布说明、校验和与 release 头部预览、OSS 与商店凭据探活；
#   不建 release、不上传资产、不推 Docker 镜像、不提交商店、不清理 artifact。构建源码 = --ref 所指提交
#   （workflow 文件与源码同一提交，与 tag 推送一致）。副作用步骤一律以 rehearsal == 'false' 放行（失败即关闭）。
#   gh workflow run release.yml --ref main -f rehearsal=true -f tag=vX.Y.Z-rc.N -f component=all
run-name: >-
  ${{ inputs.rehearsal && format('Release 演练 {0}（不发布）', inputs.tag)
  || (github.event_name == 'workflow_dispatch' && format('Release 补发 {0} · {1}', inputs.tag, inputs.component))
  || format('Release {0}', github.ref_name) }}
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "演练：tag 须尚不存在，完整构建 / 签名 / 打包但不发布任何东西（source_ref 须留空）"
        required: false
        default: false
        type: boolean
      tag:
        description: "补发：已存在的发布 tag（例如 v0.4.8 / v0.5.0-rc.1）；演练：要模拟的、尚不存在的 tag"
        required: true
        type: string
      component:
        description: "要补发 / 演练的组件；changed = 按该 tag 的变更检测；all = 全部组件（仅演练）"
        required: true
        default: mobile
        type: choice
        options:
          - changed
          - all
          - app
          - extension
          - server
          - cli
          - mobile
      source_ref:
        description: "补发的构建源码（分支 / 提交，须包含该 tag 且在发布分支上）；留空 = tag 本身。演练不接受此项"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write # 允许推送 Docker 镜像到 ghcr.io（build-server-docker job）
  actions: write # 允许在 release job 末尾删除旧 artifact（避免 500MB 配额耗尽）

# 同一 tag 串行：补发与原流水线（或两次补发）不会并发改同一个 release。
# 演练单独成组：不与同名 tag 的真实发布互相排队。
concurrency:
  group: ${{ inputs.rehearsal && 'rehearsal' || 'release' }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Windows 产物暂不代码签名（SignPath 开源项目审核未通过；不使用测试证书），
# 用户首次运行会看到 SmartScreen 提示。审核通过后在各 Windows 打包步骤前恢复签名。

jobs:
  # ── 前置 Job: 检测变更基线 tag → 当前 tag 之间哪些组件目录有变更 ──
  # 基线 PREV：稳定版 vX.Y.Z 对比上一个稳定版（跳过其间全部 -rc.N：rc 阶段改过的组件都要进稳定版，
  #            扩展也要在稳定版推商店）；预览版 vX.Y.Z-rc.N 对比上一个任意版本 tag。
  # 规则：
  #   fluxDown/**            → 浏览器扩展（extension）
  #   web/**、native/{agent,daemon,protocol,engine-protocol,api}/** → headless 服务器（server，Docker 镜像 + 多平台二进制）；
  #                            agent/daemon/protocol 同时属于 GPUI 桌面客户端（app）
  #   crates/**              → GPUI 桌面客户端（app）
  #   native/server/**       → 已冻结的旧 headless 宿主，不再触发任何构建
  #   native/engine/**       → 桌面客户端 + 服务器 + 移动端（共享下载引擎）
  #   native/mobile/**、mobile/Android/** → 原生 Android 移动端资产
  #   docker/**              → 服务器（部署文件变更需重发镜像）
  #   mobile/FluxDown/**     → 原生 iOS（独立走 ios-testflight.yml）
  #   website/**             → 官网（独立走 deploy-website.yml 部署，不发 release）
  #   docs/**、*.md          → 纯文档，不触发任何构建
  #   其余任何路径            → 桌面客户端（app）
  # 浏览器扩展与其他组件同一套判定：预览版有变动只打包附到 release、不推送各浏览器商店
  # （商店版本号不可回退，Firefox 也不做 AMO 签名）；稳定版有变动才打包并推送商店。
  # 找不到基线 tag（首个版本）时全部视为有变更。
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      extension: ${{ steps.detect.outputs.extension }}
      server: ${{ steps.detect.outputs.server }}
      mobile: ${{ steps.detect.outputs.mobile }}
      cli: ${{ steps.detect.outputs.cli }}
      engine: ${{ steps.detect.outputs.engine }}
      any: ${{ steps.detect.outputs.any }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      prev: ${{ steps.resolve.outputs.prev }}
      source: ${{ steps.resolve.outputs.source }}
      is_highest_stable: ${{ steps.resolve.outputs.is_highest_stable }}
      source_is_tag: ${{ steps.resolve.outputs.source_is_tag }}
      rehearsal: ${{ steps.resolve.outputs.rehearsal }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # tag 来源统一出口：push 取 refs/tags/*，手动补发取输入并校验 tag 真实存在。
      # 构建源码 source：默认 = tag 提交；补发可指定包含修复的分支/提交。
      # 演练：tag 必须尚不存在，在本 runner 内把它作为「本地未推送」tag 打在 --ref 提交上，
      # 之后的分支守卫、基线、变更 diff、is_highest_stable 与 tag 推送走同一套逻辑。
      # 模式互斥：勾了演练却填了已有 tag、或忘勾演练而填了未来 tag，都会在此报错，不会静默走错模式。
      - name: Resolve release tag and build source
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE: ${{ inputs.source_ref }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          REHEARSAL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ "$INPUT_REHEARSAL" = "true" ]; then REHEARSAL=true; fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::非法发布 tag '${TAG}'"
            exit 1
          fi
          if [ "$REHEARSAL" = true ]; then
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::演练 tag ${TAG} 已存在；演练只能模拟尚未发布的 tag（补发请取消勾选 rehearsal）"
              exit 1
            fi
            if [ -n "$INPUT_SOURCE" ]; then
              echo "::error::演练不接受 source_ref：构建源码即 --ref 所指提交（与 workflow 文件同一提交）"
              exit 1
            fi
            TAG_SHA="$GITHUB_SHA"
            git tag "$TAG" "$TAG_SHA"
            echo "::notice::演练：本地 tag ${TAG} → ${TAG_SHA}（不推送）"
          else
            if [ "$INPUT_COMPONENT" = "all" ]; then
              echo "::error::component=all 仅用于演练；补发请选具体组件或 changed"
              exit 1
            fi
            if ! TAG_SHA=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
              echo "::error::Tag ${TAG} 不存在（要演练未发布的 tag 请勾选 rehearsal）"
              exit 1
            fi

            # 拆分时代（server-v* / mobile-v* … 各自一个 release）的旧 vX.Y.Z release 只含桌面端且没有
            # 完成哨兵；往里补组件会让官网把它当统一 release、判桌面端缺失。旧版本不接受补发。
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
              if [ -n "$ASSETS" ] && ! grep -Eq '^SHA256SUMS-[a-z]+\.txt$' <<< "$ASSETS"; then
                echo "::error::${TAG} 是组件拆分时代的旧 release，不支持补发到统一 release"
                exit 1
              fi
            fi
          fi

          # 分支守卫：预览版 tag（vX.Y.Z-rc.N）必须打在 main 分支上，
          # 稳定版 tag（vX.Y.Z）必须打在 stable 分支上。打错分支整条流水线在此失败。
          case "$TAG" in
            *-*) BRANCH=main; PRERELEASE=true ;;
            *)   BRANCH=stable; PRERELEASE=false ;;
          esac
          git fetch origin "$BRANCH" --quiet
          if git merge-base --is-ancestor "$TAG_SHA" "origin/$BRANCH"; then
            echo "::notice::Tag $TAG is on origin/$BRANCH — OK"
          else
            echo "::error::Tag $TAG is NOT on origin/${BRANCH}（稳定版须从 stable 打，预览版 -rc.N 须从 main 打）"
            exit 1
          fi

          SOURCE_SHA="$TAG_SHA"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_SOURCE" ]; then
            SOURCE_SHA=$(git rev-parse -q --verify "origin/${INPUT_SOURCE}^{commit}" \
              || git rev-parse -q --verify "${INPUT_SOURCE}^{commit}" || true)
            if [ -z "$SOURCE_SHA" ]; then
              echo "::error::source_ref '${INPUT_SOURCE}' 无法解析为提交"
              exit 1
            fi
            # 补发源码必须是 tag 的延续（只追加修复，不回退），且已合入发布分支
            if ! git merge-base --is-ancestor "$TAG_SHA" "$SOURCE_SHA"; then
              echo "::error::source_ref ${SOURCE_SHA} 不包含 ${TAG}（须基于该 tag 继续修复）"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SOURCE_SHA" "origin/$BRANCH"; then
              echo "::error::source_ref ${SOURCE_SHA} 不在 origin/${BRANCH} 上（修复须先合入发布分支）"
              exit 1
            fi
          fi

          # 变更基线（变更检测与 release notes 共用）：稳定版跳过 -rc.N 找上一个稳定版，
          # 预览版取上一个任意版本 tag。--match 从头锚定，自动忽略 extension-v* / website-v*
          # 等历史组件 tag。找不到（首个版本）时为空 = 全量。
          if [ "$PRERELEASE" = true ]; then
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          else
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${TAG}^" 2>/dev/null || true)
          fi

          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$PRERELEASE"
            echo "prev=$PREV"
            # 与 release_publish.py 的 is_highest_stable 同规则：仅最高稳定版可推 Docker latest
            HIGHEST=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ "$PRERELEASE" != true ] && [ "$HIGHEST" = "$TAG" ]; then echo "is_highest_stable=true"; else echo "is_highest_stable=false"; fi
            echo "source=$SOURCE_SHA"
            if [ "$SOURCE_SHA" = "$TAG_SHA" ]; then echo "source_is_tag=true"; else echo "source_is_tag=false"; fi
            # 下游副作用步骤只在 rehearsal == 'false' 时执行：输出缺失 / 异常一律视为演练（失败即关闭）
            echo "rehearsal=$REHEARSAL"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag: $TAG · build source: $SOURCE_SHA · baseline: ${PREV:-<none>} · rehearsal: $REHEARSAL"

      - name: Detect changes since previous version tag
        id: detect
        shell: bash
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          COMPONENT="${{ inputs.component }}"
          REHEARSAL="${{ steps.resolve.outputs.rehearsal }}"

          # 手动补发 / 演练指定组件：只开启被选中的组件（all = 全部，仅演练），跳过目录 diff 检测；
          # 构建源码不是 tag 本身（带了修复）时补跑引擎门禁；演练恒跑引擎门禁（扩展单组件除外）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$COMPONENT" != "changed" ]; then
            ENGINE=false
            if { [ "${{ steps.resolve.outputs.source_is_tag }}" != "true" ] || [ "$REHEARSAL" = true ]; } \
              && [ "$COMPONENT" != "extension" ]; then
              ENGINE=true
            fi
            for c in app extension server mobile cli; do
              if [ "$COMPONENT" = all ] || [ "$c" = "$COMPONENT" ]; then echo "$c=true"; else echo "$c=false"; fi
            done >> "$GITHUB_OUTPUT"
            { echo "engine=$ENGINE"; echo "any=true"; } >> "$GITHUB_OUTPUT"
            if [ "$REHEARSAL" = true ]; then
              echo "::notice::Rehearsal of component ${COMPONENT} for ${TAG}"
            else
              echo "::notice::Manual re-release of component ${COMPONENT} for ${TAG}"
            fi
            exit 0
          fi

          PREV="${{ steps.resolve.outputs.prev }}"

          APP=false; EXTENSION=false; SERVER=false; MOBILE=false; CLI=false; ENGINE=false
          if [ -z "$PREV" ]; then
            echo "No previous version tag found — building everything"
            APP=true; EXTENSION=true; SERVER=true; MOBILE=true; CLI=true; ENGINE=true
          else
            echo "Diff range: ${PREV}..${TAG}"
            CHANGED=$(git diff --name-only "${PREV}" "${TAG}")
            echo "── Changed files ──"
            echo "$CHANGED"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                fluxDown/*)          EXTENSION=true ;;
                web/*)               SERVER=true ;;
                # 旧 headless 宿主 native/server 已冻结，不再触发任何组件
                native/server/*) ;;
                native/cli/*)        CLI=true ;;
                native/api/*)        APP=true; SERVER=true; CLI=true; MOBILE=true ;;
                native/protocol/*)   APP=true; SERVER=true; CLI=true; MOBILE=true ;;
                # 原生移动端经 agent/daemon 依赖 engine-protocol
                native/engine-protocol/*) APP=true; SERVER=true; MOBILE=true ;;
                # 服务器 = fluxdown-agent --server + fluxdownd；桌面 = fluxdown-desktop + 同一对进程
                native/daemon/*|native/agent/*) APP=true; SERVER=true; MOBILE=true ;;
                native/link/*)       APP=true; SERVER=true; MOBILE=true ;;
                native/mobile/*)     MOBILE=true ;;
                # GPUI 桌面客户端
                crates/*)            APP=true ;;
                native/engine/*)     APP=true; SERVER=true; MOBILE=true; CLI=true; ENGINE=true ;;
                # 引擎与 agent 共用的诊断日志文件：消费者同引擎
                native/logfile/*)    APP=true; SERVER=true; MOBILE=true; CLI=true; ENGINE=true ;;
                Cargo.toml|Cargo.lock|.cargo/*) APP=true; SERVER=true; MOBILE=true; CLI=true; ENGINE=true ;;
                .dockerignore)       SERVER=true ;;
                docker/*)            SERVER=true ;;
                packaging/*|installer/*) APP=true; SERVER=true ;;
                mobile/Android/*)    MOBILE=true ;;
                mobile/FluxDown/*) ;;
                .github/workflows/release.yml) APP=true; SERVER=true; MOBILE=true; CLI=true; ENGINE=true ;;
                # Web SPA 构建期引用共享文案与 GPUI 主题解析器（web/vite.config.ts 别名）
                assets/i18n/*)       APP=true; MOBILE=true; SERVER=true ;;
                website-v2/src/lib/gpui-theme/*) SERVER=true ;;
                assets/icon-packs/*) APP=true; SERVER=true ;;
                website/*)  ;;
                docs/*|*.md) ;;
                *)          APP=true ;;
              esac
            done <<< "$CHANGED"
          fi

          ANY=false
          if $APP || $EXTENSION || $SERVER || $MOBILE || $CLI; then ANY=true; fi

          {
            echo "app=$APP"
            echo "extension=$EXTENSION"
            echo "server=$SERVER"
            echo "mobile=$MOBILE"
            echo "cli=$CLI"
            echo "engine=$ENGINE"
            echo "any=$ANY"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Components changed in ${PREV:-<none>}..${TAG}: app=$APP extension=$EXTENSION server=$SERVER mobile=$MOBILE cli=$CLI engine=$ENGINE"

  # ── 前置 Job: 引擎协议与依赖门禁 ──
  verify-engine:
    name: Verify Engine and MSE
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip unchanged engine
        if: needs.changes.outputs.engine != 'true'
        run: echo "Engine is unchanged; protocol verification is not required."

      - name: Checkout repository
        if: needs.changes.outputs.engine == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Setup Rust toolchain
        if: needs.changes.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: needs.changes.outputs.engine == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: engine-verify-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            engine-verify-${{ runner.os }}-

      - name: Verify librqbit patch source
        id: librqbit
        if: needs.changes.outputs.engine == 'true'
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          packages = [package for package in metadata["packages"] if package["name"] == "librqbit"]
          if len(packages) != 1:
              raise SystemExit(f"expected one librqbit package, found {len(packages)}")
          package = packages[0]
          manifest = pathlib.Path(package["manifest_path"]).as_posix()
          if package["version"] != "9.0.0":
              raise SystemExit(f"unexpected librqbit version: {package['version']}")
          source = package["source"] or ""
          prefix = "git+https://github.com/zerx-lab/rqbit?rev="
          if not source.startswith(prefix):
              raise SystemExit(f"librqbit must resolve from a pinned MSE fork revision, got: {source}")
          requested_rev, separator, resolved_rev = source.removeprefix(prefix).partition("#")
          if not separator or requested_rev != resolved_rev:
              raise SystemExit(f"librqbit requested and resolved revisions differ: {source}")
          if "/native/engine/vendor/" in manifest:
              raise SystemExit(f"librqbit must not resolve from the vendored copy: {manifest}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"manifest={manifest}", file=output)
          print(f"verified fork librqbit {package['version']}: {manifest} ({source})")
          PY

      - name: Test resolved librqbit MSE fork
        if: needs.changes.outputs.engine == 'true'
        run: |
          cargo test --manifest-path "${{ steps.librqbit.outputs.manifest }}" --lib mse
          cargo test --manifest-path "${{ steps.librqbit.outputs.manifest }}" --lib read_buf
          cargo test --manifest-path "${{ steps.librqbit.outputs.manifest }}" --lib fresh_redial
          cargo test --manifest-path "${{ steps.librqbit.outputs.manifest }}" --lib --no-run

      - name: Verify engine workspace
        if: needs.changes.outputs.engine == 'true'
        run: |
          cargo check --locked -p fluxdown_engine
          cargo test --locked -p fluxdown_engine
          cargo fmt --check

  # ── 并行 Job 1: GPUI 桌面客户端 Windows（x64 + ARM64）：Inno 安装器 + 便携 zip ──
  # 四个可执行文件同目录：fluxdown-desktop（界面）→ fluxdown-agent（常驻网关/托盘）→ fluxdownd
  # （下载核心），fluxdown_nmh（浏览器扩展中继）由 agent 在同目录查找。
  # 暂不签名（SignPath 开源审核未过）：用户首次运行会看到 SmartScreen 提示。
  # 产物名、Inno AppId 与 Flutter 时代一致，旧 Flutter 客户端的自动更新直接覆盖升级为 GPUI。
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [changes, verify-engine]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.changes.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-${{ matrix.target }}
          cache-on-failure: true

      # 必须 release：debug 下 GPUI Windows 着色器按构建机绝对路径运行期读取，换机即失效。
      # FLUXCLOUD_BASE_URL 为空时不导出（option_env! 会把空串当成有效地址）。
      - name: Build desktop, agent, daemon and browser relay
        shell: bash
        env:
          FLUXDOWN_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
          FLUXDOWN_ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then export FLUXCLOUD_BASE_URL="$FLUXCLOUD_BASE_URL_SECRET"; fi
          cargo build --locked --release --target ${{ matrix.target }} \
            -p fluxdown_ui_app -p fluxdown_agent -p fluxdown_daemon -p fluxdown_nmh \
            --features fluxdown_agent/desktop --bins

      # MSVC CRT 随应用目录分发：干净系统（无 VCRedist）上否则 STATUS_DLL_NOT_FOUND。
      - name: Stage binaries
        shell: pwsh
        run: |
          $stage = "build\gpui\windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($bin in "fluxdown-desktop", "fluxdown-agent", "fluxdownd", "fluxdown_nmh") {
            Copy-Item "target\${{ matrix.target }}\release\$bin.exe" $stage
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "Visual Studio installation not found via vswhere" }
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC1*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "MSVC CRT redist for ${{ matrix.arch }} not found under $vsRoot" }
          Copy-Item "$($crtDir.FullName)\msvcp140*.dll", "$($crtDir.FullName)\vcruntime140*.dll" $stage -Force
          foreach ($required in 'msvcp140.dll', 'vcruntime140.dll') {
            if (-not (Test-Path "$stage\$required")) { throw "$required missing after CRT copy" }
          }
          Get-ChildItem $stage

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
            }
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # 语言文件已 vendor 进仓库（上游 issrc 移除了 Unofficial 目录）
      - name: Install Inno Setup Chinese Simplified language file
        shell: pwsh
        run: |
          Copy-Item "installer\windows\ChineseSimplified.isl" -Destination "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          iscc /DMyAppVersion=${{ steps.version.outputs.VERSION }} /DMyAppArch=${{ matrix.arch }} "/DMySourceDir=$PWD\build\gpui\windows-${{ matrix.arch }}" installer\windows\setup.iss

      # 便携版：根目录放 portable 标记（agent/daemon 据此把数据写在 portable_data）。
      # flux_down.exe = 轻量转发器（crates/app/src/legacy_launcher.rs）：旧 Flutter 便携版的自动更新器
      # 覆盖解压后固定重启 <dir>\flux_down.exe，由它带参拉起同目录 fluxdown-desktop.exe。
      # 只进便携包，不进安装器（setup.iss 升级时删除旧 flux_down.exe）。
      - name: Create portable zip
        shell: pwsh
        run: |
          $stage = "build\gpui\windows-${{ matrix.arch }}"
          $portable = "build\gpui\portable-${{ matrix.arch }}"
          Copy-Item $stage $portable -Recurse
          New-Item -Path "$portable\portable" -ItemType File -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\flux_down.exe" "$portable\flux_down.exe"
          Compress-Archive -Path "$portable\*" -DestinationPath "build\installer\FluxDown-${{ steps.version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          Get-ChildItem build\installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: windows-installer-${{ matrix.arch }}
          path: build/installer/FluxDown-*-setup.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: windows-portable-${{ matrix.arch }}
          path: build/installer/FluxDown-*-portable.zip
          if-no-files-found: error

  # ── 并行 Job 2: 构建浏览器扩展 ──
  build-extension:
    name: Build Browser Extension
    runs-on: ubuntu-latest
    needs: changes
    # extension 与其他组件同一套变更判定；预览版只打包附到 release，商店推送 / AMO 签名步骤
    # 均以 prerelease != 'true' 门控（商店版本号不可回退，预览包不得占用稳定版的版本号）。
    # 演练同样不碰商店（AMO listed / unlisted 都会永久占用版本号）：Firefox 出未签名包 + web-ext lint，
    # 稳定版演练另做三家商店凭据只读探活。
    if: needs.changes.outputs.extension == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${{ needs.changes.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Set extension version from tag
        working-directory: fluxDown
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          echo "Updated extension version to $VERSION"
          grep '"version"' package.json

      - name: Install dependencies
        run: npm ci
        working-directory: fluxDown

      - name: Build Chrome extension
        run: npm run build
        working-directory: fluxDown

      - name: Build Firefox extension
        run: npm run build:firefox
        working-directory: fluxDown

      - name: Package Chrome extension
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p build/extension
          cd fluxDown/.output
          zip -r ../../build/extension/FluxDown-${VERSION}-chrome.zip chrome-mv3/
          ls -la ../../build/extension/

      # 预览版 / 演练：Firefox 只出未签名包（manifest 位于 zip 根，可经 about:debugging 临时加载，或在
      # Developer Edition / Nightly 关闭签名校验后安装）。不走 AMO：unlisted 签名同样占用 AMO
      # 版本号，预览版的 X.Y.Z.1 会与稳定版冲突，稳定版补签时会下载到预览构建。
      - name: Package Firefox extension (preview, unsigned)
        if: needs.changes.outputs.prerelease == 'true' || needs.changes.outputs.rehearsal != 'false'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd fluxDown/.output/firefox-mv2
          zip -r "../../../build/extension/FluxDown-${VERSION}-firefox-unsigned.zip" .

      - name: Install web-ext
        if: needs.changes.outputs.prerelease != 'true'
        run: npm install -g web-ext

      # 演练代替 AMO 签名的本地校验：lint 出 error 即失败（AMO 提交时的同类校验会拒收）。
      - name: Lint Firefox extension (rehearsal)
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal != 'false'
        run: web-ext lint --source-dir fluxDown/.output/firefox-mv2

      # ── Firefox 双版本策略（仅稳定版）：AMO 市场用 X.Y.Z（与 tag 一致），GitHub Release XPI 用 X.Y.Z.1
      #    两个版本号不同，彻底避免同版本号重复提交冲突。
      #    X.Y.Z   → --channel=listed  → AMO 公开市场，等待人工审核
      #    X.Y.Z.1 → --channel=unlisted → 立即签名，XPI 附到 GitHub Release 供离线安装

      # Step 1: 提交 AMO 市场版本（X.Y.Z），continue-on-error 不阻塞 Release
      - name: Submit Firefox to AMO marketplace (listed, vX.Y.Z)
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal == 'false'
        continue-on-error: true
        run: |
          web-ext sign \
            --source-dir fluxDown/.output/firefox-mv2 \
            --channel=listed \
            --api-key=${{ secrets.AMO_JWT_ISSUER }} \
            --api-secret=${{ secrets.AMO_JWT_SECRET }} \
            --approval-timeout=0 \
            --artifacts-dir build/extension/firefox-listed/

      # Step 2: 将 manifest 版本改为 X.Y.Z.1，unlisted 签名产出 GitHub Release 用 XPI
      # AMO 服务端有时返回 500，continue-on-error 避免阻断整个 Release
      - name: Sign Firefox extension for GitHub Release (unlisted, vX.Y.Z.1)
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal == 'false'
        continue-on-error: true
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p build/extension
          python3 -c "import json;f='fluxDown/.output/firefox-mv2/manifest.json';m=json.load(open(f));m['version']='$VERSION.1';open(f,'w').write(json.dumps(m,indent=2))"
          echo "Manifest version set to $VERSION.1 for unlisted signing"

          web-ext sign \
            --source-dir fluxDown/.output/firefox-mv2 \
            --channel=unlisted \
            --api-key=${{ secrets.AMO_JWT_ISSUER }} \
            --api-secret=${{ secrets.AMO_JWT_SECRET }} \
            --artifacts-dir build/extension/ 2>&1 | tee /tmp/amo_sign.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            if grep -q "already exists" /tmp/amo_sign.log; then
              echo "::warning::Version $VERSION.1 already on AMO (CI re-run). Downloading existing XPI..."
              _amo_jwt() {
                local iat exp header payload sig
                iat=$(date +%s); exp=$((iat + 300))
                header=$(printf '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
                payload=$(printf '{"iss":"%s","jti":"%s","iat":%s,"exp":%s}' \
                  "$AMO_ISSUER" "$iat" "$iat" "$exp" | base64 -w0 | tr '+/' '-_' | tr -d '=')
                sig=$(printf '%s.%s' "$header" "$payload" \
                  | openssl dgst -sha256 -hmac "$AMO_SECRET" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
                printf '%s.%s.%s' "$header" "$payload" "$sig"
              }
              VERS_DATA=$(curl -sf -H "Authorization: JWT $(_amo_jwt)" \
                "https://addons.mozilla.org/api/v5/addons/addon/fluxdown%40fluxdown.app/versions/?filter=all_with_unlisted")
              XPI_URL=$(echo "$VERS_DATA" | python3 -c "import sys,json;d=json.load(sys.stdin);v=next((x for x in(d.get('results')or[])if x.get('version')=='$VERSION.1'),None);sys.exit('not found') if not(v and(v.get('file')or{}).get('url')) else print(v['file']['url'])")
              curl -sf -L -H "Authorization: JWT $(_amo_jwt)" \
                -o "build/extension/${VERSION}.xpi" "$XPI_URL"
            elif grep -q "was uploaded before and deleted" /tmp/amo_sign.log; then
              echo "::error::Version $VERSION.1 was deleted from AMO. Please use a new version number."
              exit 1
            else
              cat /tmp/amo_sign.log
              exit 1
            fi
          fi

          XPI_FILE=$(ls build/extension/*.xpi 2>/dev/null | head -1)
          if [ -n "$XPI_FILE" ]; then
            mv "$XPI_FILE" "build/extension/FluxDown-${VERSION}-firefox.xpi"
            echo "Firefox XPI ready: FluxDown-${VERSION}-firefox.xpi (internal version $VERSION.1)"
          else
            echo "::error::No signed XPI found."
            exit 1
          fi
        env:
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.VERSION }}

      # ── Upload artifacts（供 release job 使用）──
      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: browser-extension-chrome
          path: build/extension/FluxDown-*-chrome.zip
          if-no-files-found: error

      # ── Chrome Web Store 自动发布（仅稳定版；需 CHROME_CLIENT_ID / CHROME_CLIENT_SECRET / CHROME_REFRESH_TOKEN）──
      # ⚠️  Refresh Token 在 Google OAuth 同意屏幕处于 Testing 模式时 7 天过期。
      #    发布前必须将同意屏幕切换到 Production，再重新走一次 OAuth 流程获取长期 token。
      - name: Publish Chrome extension to Web Store
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal == 'false'
        continue-on-error: true
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ZIP_FILE="build/extension/FluxDown-${VERSION}-chrome.zip"
          EXTENSION_ID="meleenglfggcmcajknpeeeiobnpfmahc"

          # 用 refresh_token 换取新的 access_token
          ACCESS_TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # 上传新版本 zip
          echo "Uploading ${ZIP_FILE} to Chrome Web Store..."
          UPLOAD_RESP=$(curl -sf \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -X PUT -T "${ZIP_FILE}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}")

          echo "Upload response: ${UPLOAD_RESP}"
          UPLOAD_STATE=$(echo "${UPLOAD_RESP}" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")

          if [ "${UPLOAD_STATE}" != "SUCCESS" ]; then
            echo "::error::Chrome Web Store upload failed (uploadState=${UPLOAD_STATE})"
            exit 1
          fi

          # 发布已上传的草稿版本
          PUBLISH_RESP=$(curl -sf \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish")

          echo "Publish response: ${PUBLISH_RESP}"
          STATUS=$(echo "${PUBLISH_RESP}" | python3 -c \
            "import sys,json; print(','.join(json.load(sys.stdin).get('status',[])))")
          echo "Publish status codes: ${STATUS}"

          if echo "${STATUS}" | grep -qi "error"; then
            echo "::error::Chrome Web Store publish failed (status=${STATUS})"
            exit 1
          fi

          echo "::notice::Chrome extension v${VERSION} submitted to Web Store review"

      # ── Edge Add-ons 商店自动发布（仅稳定版；需 EDGE_CLIENT_ID / EDGE_API_KEY / EDGE_PRODUCT_ID）──
      # Edge 复用 Chrome MV3 构建（同为 MV3），但 Edge 商店拒绝 manifest 含 key 字段的包
      # （PackageValidationError: "The manifest shouldn't contain the key field"），
      # 而 Chrome 侧载固定扩展 ID 依赖 key（见 fluxDown/wxt.config.ts），
      # 因此上传前解包剔除 key 重新打一个 Edge 专用 zip。API v1.1：ApiKey 鉴权。
      # ⚠️  API key 每 72 天过期，过期后需在 Partner Center → Publish API 重新生成并更新 EDGE_API_KEY secret。
      - name: Publish Edge extension to Edge Add-ons
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal == 'false'
        continue-on-error: true
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -uo pipefail
          CHROME_ZIP="build/extension/FluxDown-${VERSION}-chrome.zip"
          BASE="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}"
          AUTH=(-H "Authorization: ApiKey ${EDGE_API_KEY}" -H "X-ClientID: ${EDGE_CLIENT_ID}")

          # 0) 重打 Edge 专用包：剔除 manifest.json 中的 key 字段
          PKG_DIR=$(mktemp -d)
          unzip -q "$CHROME_ZIP" -d "$PKG_DIR"
          MANIFEST=$(find "$PKG_DIR" -maxdepth 2 -name manifest.json | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::manifest.json not found in ${CHROME_ZIP}"; exit 1
          fi
          python3 -c "import json,sys;p=sys.argv[1];m=json.load(open(p));m.pop('key',None);open(p,'w').write(json.dumps(m,indent=2))" "$MANIFEST"
          ZIP_FILE="$PWD/build/extension/FluxDown-${VERSION}-edge.zip"
          # Chrome zip 内含 chrome-mv3/ 顶层目录；Edge 要求 manifest.json 位于 zip 根，故从 manifest 所在目录打包
          (cd "$(dirname "$MANIFEST")" && zip -qr "$ZIP_FILE" .)
          echo "Edge package rebuilt without manifest key: $ZIP_FILE"

          # 1) 上传 zip 包到 draft（202 + Location 头携带 operationID）
          echo "Uploading ${ZIP_FILE} to Edge Add-ons..."
          UP_HEADERS=$(curl -sS -D - -o /dev/null -X POST "${BASE}/submissions/draft/package" \
            "${AUTH[@]}" -H "Content-Type: application/zip" --data-binary "@${ZIP_FILE}")
          OP=$(echo "$UP_HEADERS" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | awk -F/ '{print $NF}')
          if [ -z "$OP" ]; then
            echo "::error::Edge upload did not return an operation id"; echo "$UP_HEADERS"; exit 1
          fi
          echo "Upload operation: $OP"

          # 2) 轮询上传处理状态（InProgress → Succeeded / Failed）
          STATUS="?"
          for i in $(seq 1 20); do
            sleep 10
            RESP=$(curl -sS "${BASE}/submissions/draft/package/operations/${OP}" "${AUTH[@]}")
            STATUS=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
            echo "  upload status: $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            if [ "$STATUS" = "Failed" ]; then echo "::error::Edge upload failed: $RESP"; exit 1; fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Edge upload timed out (status=$STATUS)"; exit 1
          fi

          # 3) 提交发布（202 + Location 头携带发布 operationID）
          echo "Publishing Edge submission..."
          PUB_HEADERS=$(curl -sS -D - -o /dev/null -X POST "${BASE}/submissions" \
            "${AUTH[@]}" -H "Content-Type: application/json" \
            --data "{\"notes\":\"Automated release v${VERSION}\"}")
          PUB_OP=$(echo "$PUB_HEADERS" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | awk -F/ '{print $NF}')
          echo "Publish operation: ${PUB_OP:-<none>}"
          echo "::notice::Edge extension v${VERSION} submitted to Edge Add-ons review"

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: browser-extension-firefox
          # 稳定版：AMO 签名的 .xpi；预览版 / 演练：未签名 .zip
          path: |
            build/extension/FluxDown-*-firefox.xpi
            build/extension/FluxDown-*-firefox-unsigned.zip
          if-no-files-found: warn

      # 演练（仅稳定版）：三家商店凭据只读探活，任一失败即让本 job 失败——真实发布里商店步骤是
      # continue-on-error，凭据过期只会静默漏推。放在 artifact 上传之后，探活失败不丢安装包。
      #   AMO：JWT 读版本列表，并确认 X.Y.Z / X.Y.Z.1 未被占用（占用则真实提交必失败）
      #   Chrome：refresh_token 换 access_token 后读取商店条目（DRAFT 投影，只读）
      #   Edge：以不存在的 operation ID 查询上传状态——401/403 = ApiKey 失效，404 = 鉴权通过
      - name: Probe store credentials (rehearsal)
        if: needs.changes.outputs.prerelease != 'true' && needs.changes.outputs.rehearsal != 'false'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -uo pipefail
          FAIL=0

          _amo_jwt() {
            local iat exp header payload sig
            iat=$(date +%s); exp=$((iat + 300))
            header=$(printf '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
            payload=$(printf '{"iss":"%s","jti":"%s","iat":%s,"exp":%s}' \
              "$AMO_ISSUER" "$iat" "$iat" "$exp" | base64 -w0 | tr '+/' '-_' | tr -d '=')
            sig=$(printf '%s.%s' "$header" "$payload" \
              | openssl dgst -sha256 -hmac "$AMO_SECRET" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
            printf '%s.%s.%s' "$header" "$payload" "$sig"
          }
          if [ -z "$AMO_ISSUER" ] || [ -z "$AMO_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET 未配置"; FAIL=1
          elif VERS=$(curl -sf -H "Authorization: JWT $(_amo_jwt)" \
              "https://addons.mozilla.org/api/v5/addons/addon/fluxdown%40fluxdown.app/versions/?filter=all_with_unlisted"); then
            TAKEN=$(printf '%s' "$VERS" | python3 -c "import sys,json;v=sys.argv[1];d=json.load(sys.stdin);print(' '.join(x['version'] for x in d.get('results') or [] if x.get('version') in (v, v+'.1')))" "$VERSION")
            if [ -n "$TAKEN" ]; then
              echo "::error::AMO 已存在版本 ${TAKEN}，真实发布的 AMO 提交会失败"; FAIL=1
            else
              echo "✅ AMO 凭据有效，${VERSION} / ${VERSION}.1 未被占用"
            fi
          else
            echo "::error::AMO 凭据探活失败"; FAIL=1
          fi

          if ACCESS_TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
                -d "client_id=${CHROME_CLIENT_ID}" \
                -d "client_secret=${CHROME_CLIENT_SECRET}" \
                -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
                -d "grant_type=refresh_token" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])") \
            && ITEM=$(curl -sf -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "x-goog-api-version: 2" \
                "https://www.googleapis.com/chromewebstore/v1.1/items/meleenglfggcmcajknpeeeiobnpfmahc?projection=DRAFT"); then
            echo "✅ Chrome Web Store 凭据有效：$(printf '%s' "$ITEM" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id'), 'uploadState=%s' % d.get('uploadState'))")"
          else
            echo "::error::Chrome Web Store 凭据探活失败（refresh token 过期 / OAuth 同意屏幕仍为 Testing / 无权限）"; FAIL=1
          fi

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/00000000-0000-0000-0000-000000000000") || CODE=000
          case "$CODE" in
            401|403|000) echo "::error::Edge Add-ons 凭据探活失败（HTTP ${CODE}；EDGE_API_KEY 每 72 天过期）"; FAIL=1 ;;
            *) echo "✅ Edge Add-ons ApiKey 被接受（HTTP ${CODE}）" ;;
          esac

          exit "$FAIL"

  # ── 并行 Job 3: GPUI 桌面客户端 Linux x64：tar.gz / AppImage / deb / Arch ──
  # ubuntu-22.04 构建（glibc 2.35 基线，兼容面与 Flutter 时代一致）；打包逻辑与运行期布局
  # 说明见 scripts/package_gpui_linux.sh（AppRun 保持挂载直到常驻 agent/daemon 退出）。
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    needs: [changes, verify-engine]
    if: needs.changes.outputs.app == 'true'
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake pkg-config zstd libfuse2 desktop-file-utils \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libzstd-dev libdbus-1-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Build desktop, agent, daemon and browser relay
        env:
          FLUXDOWN_APP_VERSION: ${{ needs.changes.outputs.version }}
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
          FLUXDOWN_ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then export FLUXCLOUD_BASE_URL="$FLUXCLOUD_BASE_URL_SECRET"; fi
          cargo build --locked --release \
            -p fluxdown_ui_app -p fluxdown_agent -p fluxdown_daemon -p fluxdown_nmh \
            --features fluxdown_agent/desktop --bins

      - name: Download appimagetool
        run: |
          wget -qO "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Package
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          BIN_DIR: target/release
          OUT_DIR: build/installer
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/package_gpui_linux.sh

      # 安装冒烟：deb 能装（依赖可解析）、四个二进制同目录、/usr/bin 入口解析到 /opt/fluxdown、
      # .desktop 合法、动态库无缺失。
      - name: Verify deb install layout
        run: |
          sudo apt-get install -y ./build/installer/FluxDown-*-linux-x64.deb
          for bin in fluxdown-desktop fluxdown-agent fluxdownd fluxdown_nmh; do test -x "/opt/fluxdown/$bin"; done
          test "$(readlink -f /usr/bin/fluxdown-desktop)" = /opt/fluxdown/fluxdown-desktop
          desktop-file-validate /usr/share/applications/com.fluxdown.app.desktop
          if ldd /opt/fluxdown/fluxdown-desktop /opt/fluxdown/fluxdown-agent /opt/fluxdown/fluxdownd | grep "not found"; then
            echo "::error::missing shared libraries"; exit 1
          fi

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-appimage
          path: build/installer/FluxDown-*-linux-x64.AppImage
          if-no-files-found: error

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-deb
          path: build/installer/FluxDown-*-linux-x64.deb
          if-no-files-found: error

      - name: Upload Linux Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-arch
          path: build/installer/FluxDown-*-linux-x64.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Linux portable artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-portable
          path: build/installer/FluxDown-*-linux-x64.tar.gz
          if-no-files-found: error

  # ── 并行 Job 4: GPUI 桌面客户端 macOS（Intel x64 + Apple Silicon arm64）：DMG + tar.gz ──
  # scripts/package_gpui_macos.sh：FluxDown.app（agent 辅助 bundle）→ Developer ID 签名
  # （Hardened Runtime）→ DMG → notarytool 公证 → staple（DMG 与 .app 均 staple，Gatekeeper
  # 离线可验，避免“已损坏”提示）。缺签名/公证 secrets 时直接失败，绝不发布 ad-hoc 包。
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [changes, verify-engine]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script_arch: x86_64
          - arch: arm64
            runner: macos-15
            script_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Decode signing and notarization credentials
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 / APPLE_API_KEY_P8_BASE64 未配置，拒绝发布未签名的 macOS 包"
            exit 1
          fi
          umask 077
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize and package
        env:
          ARCHS: ${{ matrix.script_arch }}
          VERSION: ${{ needs.changes.outputs.version }}
          FLUXDOWN_APP_VERSION: ${{ needs.changes.outputs.version }}
          ARTIFACT_PREFIX: FluxDown-${{ needs.changes.outputs.version }}-macos-${{ matrix.arch }}
          OUT_DIR: ${{ github.workspace }}/build/installer
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
          FLUXDOWN_ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then export FLUXCLOUD_BASE_URL="$FLUXCLOUD_BASE_URL_SECRET"; fi
          MACOS_CERT_P12_PATH="$RUNNER_TEMP/cert.p12" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
            scripts/package_gpui_macos.sh

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: macos-dmg-${{ matrix.arch }}
          path: build/installer/FluxDown-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload macOS portable artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: macos-portable-${{ matrix.arch }}
          path: build/installer/FluxDown-*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ── 并行 Job 4b: 原生 Android 签名 APK（各 ABI + 通用包）──
  # 与手动打包共用 package.sh / ANDROID_NATIVE_*；签名不兼容旧 Flutter APK，不能覆盖安装。
  # 发布资产继续使用 android-<abi> 命名，保留下载消费者与统一 release 的契约。
  build-android:
    name: Build Android APK
    # cargo-ndk 预编译包需要 GLIBC 2.39。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [changes, verify-engine]
    if: needs.changes.outputs.mobile == 'true'
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-package
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Decode signing keystore
        env:
          ANDROID_NATIVE_KEYSTORE_BASE64: ${{ secrets.ANDROID_NATIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_NATIVE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_NATIVE_KEYSTORE_BASE64 未配置"
            exit 1
          fi
          umask 077
          echo "$ANDROID_NATIVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # SDK / NDK 使用 runner 预装版本，与 android-package.yml 一致。
      - name: Build, sign and verify
        env:
          FLUXDOWN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NATIVE_KEYSTORE_PASSWORD }}
          FLUXDOWN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_NATIVE_KEY_ALIAS }}
          FLUXDOWN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_NATIVE_KEY_PASSWORD }}
          FLUXCLOUD_BASE_URL: ${{ secrets.FLUXCLOUD_BASE_URL }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          FLUXDOWN_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" \
            mobile/Android/scripts/package.sh --version "$VERSION" \
              --abis arm64-v8a,armeabi-v7a,x86_64 --out "$RUNNER_TEMP/apk"
          mkdir -p build/android
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "$RUNNER_TEMP/apk/FluxDown-${VERSION}-android-native-${abi}.apk" \
              "build/android/FluxDown-${VERSION}-android-${abi}.apk"
          done

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: android-apk
          path: build/android/FluxDown-*.apk
          if-no-files-found: error

  # ── 并行 Job 5a: 构建服务器 Web SPA（一次构建，供所有平台二进制包复用）──
  build-web:
    name: Build Server Web SPA
    runs-on: ubuntu-latest
    needs: [changes, verify-engine]
    if: needs.changes.outputs.server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web SPA
        working-directory: web
        run: bun run build

      - name: Upload webroot artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: server-webroot
          path: web/dist

  # ── 并行 Job 5b: 构建 Headless 服务器多平台二进制（下载解压即运行）──
  # 全部使用原生 runner，规避 ring/bundled-sqlite/zstd 等 C 依赖的交叉编译工具链问题：
  #   linux   → musl 静态链接（零 glibc 依赖，任何发行版/NAS 直接运行）
  #   windows → MSVC + Schannel（native-tls），无额外运行时依赖
  #   macos   → arm64 runner 原生编译 + 交叉编译 x64（Apple SDK 双架构开箱即用）
  # 不提供 x86(32位)：macOS/Win11 已无 32 位，Linux i686 无实际需求；
  # 如需 armv7（老 NAS/树莓派 32 位）可后续用 cross-rs 追加 matrix 项。
  # 打包布局：fluxdown-agent(.exe) + fluxdownd(.exe) 同目录——Web SPA 由 fluxdown_agent
  # （feature web-ui）在编译期经 FLUXDOWN_EMBED_WEBROOT 嵌进 agent，产物不附带 web/ 目录。
  # 运行：fluxdown-agent --server（agent 拉起同级 fluxdownd）。
  build-server-binaries:
    name: Build Server (${{ matrix.platform }})
    needs: [changes, verify-engine, build-web]
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          V="${{ needs.changes.outputs.tag }}"
          echo "VERSION=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc：ring/bundled-sqlite/zstd 等 C 依赖静态编译所需
      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: server-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            server-${{ matrix.platform }}-

      # 前端产物必须在 cargo build 之前就位：build.rs 按 FLUXDOWN_EMBED_WEBROOT
      # 把 web/dist 全量 include_bytes! 进二进制（单文件分发）。
      - name: Download webroot artifact
        uses: actions/download-artifact@v4
        with:
          name: server-webroot
          path: webroot

      # x86_64 目标使用基线 x86-64（RUSTFLAGS 整体替换 .cargo/config.toml 的 rustflags，
      # 该文件当前只有 target-cpu 一项）；产品版本由 FLUXDOWN_APP_VERSION 注入。
      - name: Build server binaries (agent + daemon)
        env:
          FLUXDOWN_ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}
          FLUXCLOUD_BASE_URL: ${{ secrets.FLUXCLOUD_BASE_URL }}
          FLUXDOWN_EMBED_WEBROOT: ${{ github.workspace }}/webroot
          FLUXDOWN_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64') && '-C target-cpu=x86-64' || '' }}
        run: |
          cargo build --release --locked -p fluxdown_agent --features web-ui --target ${{ matrix.target }}
          cargo build --release --locked -p fluxdown_daemon --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PKG="fluxdown-server-${VERSION}-${{ matrix.platform }}"
          mkdir -p "build/server/${PKG}" release-assets
          cp "target/${{ matrix.target }}/release/fluxdown-agent" "target/${{ matrix.target }}/release/fluxdownd" "build/server/${PKG}/"
          tar -C build/server -czf "release-assets/FluxDown-Server-${VERSION}-${{ matrix.platform }}.tar.gz" "${PKG}"
          ls -la release-assets/

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.VERSION }}"
          $Pkg = "fluxdown-server-$Version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "build\server\$Pkg", "release-assets" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\fluxdown-agent.exe" "build\server\$Pkg\"
          Copy-Item "target\${{ matrix.target }}\release\fluxdownd.exe" "build\server\$Pkg\"
          Compress-Archive -Path "build\server\$Pkg" -DestinationPath "release-assets\FluxDown-Server-$Version-${{ matrix.platform }}.zip"
          Get-ChildItem release-assets

      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: server-bin-${{ matrix.platform }}
          path: release-assets/*

  # ── 并行 Job 5c': NAS/软路由包（OpenWrt ipk + QNAP qpkg + 群晖 spk，复用 linux musl 静态产物）──
  # ipk 纯脚本手打（packaging/openwrt/build_ipk.sh，无需 OpenWrt SDK）；
  # qpkg 用官方 QDK qbuild（packaging/qnap/build_qpkg.sh）。
  # 不跑 InstallToUbuntu.sh（其 apt 依赖列表含 ubuntu 24.04 已不存在的 `python` 包），手动装 QDK。
  # spk 纯脚本手打（packaging/synology/build_spk.sh，做法同 SynoCommunity spksrc，无需群晖 toolkit）；
  # DSM 6 / DSM 7 × x86_64 / armv8 共 4 包（DSM 7 强制套件用户运行，DSM 6 root）。
  # 产物名带 server-bin- 前缀 → upload-server 的 download pattern 自动收集附到统一 release。
  build-server-nas-packages:
    name: Build Server (OpenWrt/QNAP/Synology packages)
    needs: [changes, build-server-binaries]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Get version from tag
        id: version
        run: |
          V="${{ needs.changes.outputs.tag }}"
          echo "VERSION=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Download linux server tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: server-bin-linux-*
          path: tarballs/
          merge-multiple: true

      - name: Extract server binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p extracted
          tar -C extracted -xzf "tarballs/FluxDown-Server-${VERSION}-linux-x64.tar.gz"
          tar -C extracted -xzf "tarballs/FluxDown-Server-${VERSION}-linux-arm64.tar.gz"

      - name: Install QDK and imagemagick
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick build-essential rsync
          git clone --depth 1 https://github.com/qnap-dev/QDK.git /tmp/QDK
          make -C /tmp/QDK/src
          sudo cp /tmp/QDK/src/bin/qpkg_encrypt /bin/
          sudo cp -rf /tmp/QDK/shared /usr/share/QDK
          sudo mkdir -p /etc/config
          sed -e '2d' /tmp/QDK/shared/qdk.conf | sudo tee /etc/config/qdk.conf > /dev/null
          sudo sed -i '2iQDK_PATH_P=/usr/share' /etc/config/qdk.conf
          echo "/usr/share/QDK/bin" >> "$GITHUB_PATH"

      - name: Build OpenWrt ipk
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          X64="extracted/fluxdown-server-${VERSION}-linux-x64"
          A64="extracted/fluxdown-server-${VERSION}-linux-arm64"
          ./packaging/openwrt/build_ipk.sh server "$VERSION" "$X64" x86_64 release-assets
          ./packaging/openwrt/build_ipk.sh server "$VERSION" "$A64" \
            aarch64_generic,aarch64_cortex-a53,aarch64_cortex-a72,aarch64_cortex-a76 release-assets
          ./packaging/openwrt/build_ipk.sh luci "$VERSION" release-assets

      - name: Build QNAP qpkg
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          X64="extracted/fluxdown-server-${VERSION}-linux-x64"
          A64="extracted/fluxdown-server-${VERSION}-linux-arm64"
          ./packaging/qnap/build_qpkg.sh "$VERSION" x86_64 "$X64" \
            "release-assets/FluxDown-Server-${VERSION}-qnap-x64.qpkg"
          ./packaging/qnap/build_qpkg.sh "$VERSION" arm_64 "$A64" \
            "release-assets/FluxDown-Server-${VERSION}-qnap-arm64.qpkg"

      - name: Build Synology spk
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          X64="extracted/fluxdown-server-${VERSION}-linux-x64"
          A64="extracted/fluxdown-server-${VERSION}-linux-arm64"
          for dsm in dsm7 dsm6; do
            ./packaging/synology/build_spk.sh "$VERSION" "$dsm" x86_64 "$X64" \
              "release-assets/FluxDown-Server-${VERSION}-synology-${dsm}-x64.spk"
            ./packaging/synology/build_spk.sh "$VERSION" "$dsm" armv8 "$A64" \
              "release-assets/FluxDown-Server-${VERSION}-synology-${dsm}-arm64.spk"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: server-bin-nas-packages
          path: release-assets/*

  # ── 并行 Job: 构建 CLI 二进制（fluxdown，6 平台）──
  # 与 build-server-binaries 同套 runner/target 策略（全原生 runner 规避 C 依赖交叉编译）：
  #   linux   → musl 静态链接（零 glibc 依赖）
  #   windows → MSVC + Schannel（native-tls）
  #   macos   → 各架构原生 runner 编译
  # CLI 是单二进制（无 webroot），产物即 fluxdown(.exe)。
  build-cli-binaries:
    name: Build CLI (${{ matrix.platform }})
    needs: [changes, verify-engine]
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.changes.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc：ring 等 C 依赖静态编译所需
      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cli-${{ matrix.platform }}-

      # 服务器/NAS 常见的老 x86_64 CPU 不一定有 SSE4.2/POPCNT：x86_64 目标回退基线 x86-64
      # （RUSTFLAGS 整体替换 .cargo/config.toml 的 rustflags，该文件当前只有 target-cpu 一项）。
      - name: Build CLI binary
        env:
          FLUXDOWN_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64') && '-C target-cpu=x86-64' || '' }}
        run: cargo build --release --locked -p fluxdown_cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PKG="fluxdown-cli-${VERSION}-${{ matrix.platform }}"
          mkdir -p "build/cli/${PKG}" release-assets
          cp "target/${{ matrix.target }}/release/fluxdown" "build/cli/${PKG}/"
          tar -C build/cli -czf "release-assets/FluxDown-CLI-${VERSION}-${{ matrix.platform }}.tar.gz" "${PKG}"
          ls -la release-assets/

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.VERSION }}"
          $Pkg = "fluxdown-cli-$Version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "build\cli\$Pkg", "release-assets" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\fluxdown.exe" "build\cli\$Pkg\"
          Compress-Archive -Path "build\cli\$Pkg" -DestinationPath "release-assets\FluxDown-CLI-$Version-${{ matrix.platform }}.zip"
          Get-ChildItem release-assets

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: cli-bin-${{ matrix.platform }}
          path: release-assets/*

  # ── 并行 Job 5c: Docker 镜像（linux/amd64 + linux/arm64，推 ghcr.io）──
  # linux 二进制 tarball 已由 build-server-binaries（musl 静态链接）产出，此处只推镜像。
  # Rust 编译在 Dockerfile 内按 TARGETARCH 交叉编译（不走 QEMU）；QEMU 仅用于 arm64 运行时层的 apt。
  # 演练：照常登录 ghcr（验证凭据）并完整构建双架构镜像，但不推送。
  build-server-docker:
    name: Build Server (Docker)
    runs-on: ubuntu-latest
    needs: [changes, verify-engine]
    if: needs.changes.outputs.server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source }}

      # 源码取 tag 本身的补发：仅 Docker 构建配置取本次 workflow 提交的修复（修打包不动源码）。
      # 指定了 source_ref 时修复已在源码里，不再覆盖。
      - name: Apply Docker build configuration for manual re-release
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.source_is_tag == 'true' && needs.changes.outputs.rehearsal == 'false'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$WORKFLOW_SHA"
          git restore --source="$WORKFLOW_SHA" -- .dockerignore docker/server.Dockerfile

      - name: Get version from tag
        id: version
        run: |
          V="${{ needs.changes.outputs.tag }}"
          echo "VERSION=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 runtime layer)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名要求全小写，metadata-action 自动归一化
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxdown-server
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ needs.changes.outputs.is_highest_stable == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.changes.outputs.rehearsal == 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLUXDOWN_ANALYTICS_APP_KEY=${{ secrets.ANALYTICS_APP_KEY }}
            FLUXCLOUD_BASE_URL=${{ secrets.FLUXCLOUD_BASE_URL }}
            FLUXDOWN_APP_VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  # ── Release Job 1: 准备统一 release（生成双语说明 + 建草稿）──
  # 与构建并行；上传 job 只在草稿就绪后开始。
  # tag 推送：生成说明并写入（release 已存在时只刷新说明，不改草稿/发布状态）；
  # 手动补发：release 已存在则不动，缺失时以兜底标题新建草稿（说明可事后手改）。
  # 演练：在本 runner 打本地 tag 后照常生成说明，写入 job summary 与 artifact，不建草稿。
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.changes.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 不检出 tag：本地 composite action（release-notes）从 workspace 加载，
          # 检出 tag 会跑成旧版本 action。历史与 tag 已由 fetch-depth:0 + fetch-tags 提供。

      # 演练：release-notes 按 tag 取 git 区间，tag 尚不存在，打一个只在本 runner 内的本地 tag（不推送）
      - name: Create local rehearsal tag
        if: needs.changes.outputs.rehearsal != 'false'
        run: git tag "$TAG" "${{ needs.changes.outputs.source }}"

      - name: Check existing release
        id: existing
        if: needs.changes.outputs.rehearsal == 'false'
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Describe release scope
        id: scope
        if: github.event_name == 'push' || needs.changes.outputs.rehearsal != 'false'
        env:
          C_APP: ${{ needs.changes.outputs.app }}
          C_SERVER: ${{ needs.changes.outputs.server }}
          C_CLI: ${{ needs.changes.outputs.cli }}
          C_MOBILE: ${{ needs.changes.outputs.mobile }}
          C_EXTENSION: ${{ needs.changes.outputs.extension }}
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
        run: |
          SCOPE=""
          add() { SCOPE="${SCOPE:+${SCOPE}、}$1"; }
          if [ "$C_APP" = true ]; then add "桌面客户端（Windows / macOS / Linux）"; fi
          if [ "$C_SERVER" = true ]; then add "Headless 服务器（含 Web 控制台 / Docker / NAS 套件）"; fi
          if [ "$C_CLI" = true ]; then add "命令行工具 CLI"; fi
          if [ "$C_MOBILE" = true ]; then add "Android 移动端"; fi
          if [ "$C_EXTENSION" = true ]; then
            if [ "$PRERELEASE" = true ]; then
              add "浏览器扩展预览包（Chrome / Edge 解压加载、Firefox 未签名，仅附于本 release，不推送商店）"
            else
              add "浏览器扩展（Chrome / Firefox / Edge）"
            fi
          fi
          echo "component=${SCOPE}" >> "$GITHUB_OUTPUT"

      # AI 撰写面向用户的双语 release notes（素材 = git-cliff + commit 正文 + 变更统计）
      # 实现见 .github/actions/release-notes/action.yml
      - name: Generate release notes
        if: github.event_name == 'push' || needs.changes.outputs.rehearsal != 'false'
        uses: ./.github/actions/release-notes
        with:
          component: FluxDown 统一发布，本次包含：${{ steps.scope.outputs.component }}
          fallback-title: Release ${{ needs.changes.outputs.tag }}
          tag: ${{ needs.changes.outputs.tag }}
          since: ${{ needs.changes.outputs.prev }}
          # 演练：tag 只在本 runner 本地，git-cliff 的 GitHub 元数据查询改用已推送的源码提交
          end-ref: ${{ needs.changes.outputs.rehearsal != 'false' && needs.changes.outputs.source || '' }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Create or update draft release
        if: needs.changes.outputs.rehearsal == 'false'
        env:
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NOTES=RELEASE_NOTES.md
          elif [ "$EXISTS" = true ]; then
            echo "Release ${TAG} already exists — re-release keeps its notes"
            exit 0
          else
            NOTES="$RUNNER_TEMP/notes.md"
            echo "Release ${TAG}" > "$NOTES"
          fi

          if [ "$EXISTS" = true ]; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            ARGS=(--draft --verify-tag --title "$TAG" --notes-file "$NOTES")
            case "$TAG" in *-*) ARGS+=(--prerelease) ;; esac
            gh release create "$TAG" "${ARGS[@]}"
          fi

      - name: Show rehearsal release notes
        if: needs.changes.outputs.rehearsal != 'false'
        run: |
          {
            echo "## 演练：${TAG} 发布说明预览（未创建 release）"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rehearsal release notes
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  # ── Release Job 2: 各组件上传到统一 release（互不依赖，任一组件失败不影响其余）──
  # release-upload 最后上传 SHA256SUMS-<组件>.txt 完成哨兵；OSS 同步失败不阻断发布
  # （官网 /api/download 缺 OSS 对象时回退 GitHub）。
  # 演练：release-upload / oss-upload 走 dry-run（只生成哨兵、只读探活 OSS，OSS 失败即报错），
  # 哨兵存为 rehearsal-sums-<组件> artifact 供 publish-release 预览。
  upload-app:
    name: Upload Desktop App
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, build-windows, build-linux, build-macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release-assets/
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release-assets/
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets/
          merge-multiple: true

      - name: Upload to release
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          component: app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

      - name: Keep rehearsal checksum sentinel
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-sums-app
          path: release-assets/SHA256SUMS-app.txt
          if-no-files-found: error

      - name: Upload release assets to OSS
        continue-on-error: ${{ needs.changes.outputs.rehearsal == 'false' }}
        uses: ./.github/actions/oss-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

  upload-extension:
    name: Upload Browser Extension
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, build-extension]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser extensions
        uses: actions/download-artifact@v4
        with:
          pattern: browser-extension-*
          path: release-assets/
          merge-multiple: true

      - name: Upload to release
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          component: extension
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

      - name: Keep rehearsal checksum sentinel
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-sums-extension
          path: release-assets/SHA256SUMS-extension.txt
          if-no-files-found: error

      - name: Upload release assets to OSS
        continue-on-error: ${{ needs.changes.outputs.rehearsal == 'false' }}
        uses: ./.github/actions/oss-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

  # Docker 镜像直接推 ghcr（不是 release 资产），其失败由 publish-release 单独报告，不阻断二进制上传。
  upload-server:
    name: Upload Server
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, build-server-binaries, build-server-nas-packages]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-bin-*
          path: release-assets/
          merge-multiple: true

      - name: Upload to release
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          component: server
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

      - name: Keep rehearsal checksum sentinel
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-sums-server
          path: release-assets/SHA256SUMS-server.txt
          if-no-files-found: error

      - name: Upload release assets to OSS
        continue-on-error: ${{ needs.changes.outputs.rehearsal == 'false' }}
        uses: ./.github/actions/oss-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

  upload-cli:
    name: Upload CLI
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, build-cli-binaries]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-bin-*
          path: release-assets/
          merge-multiple: true

      - name: Upload to release
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          component: cli
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

      - name: Keep rehearsal checksum sentinel
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-sums-cli
          path: release-assets/SHA256SUMS-cli.txt
          if-no-files-found: error

      - name: Upload release assets to OSS
        continue-on-error: ${{ needs.changes.outputs.rehearsal == 'false' }}
        uses: ./.github/actions/oss-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

  upload-mobile:
    name: Upload Mobile
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, build-android]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-apk
          path: release-assets/
          merge-multiple: true

      - name: Upload to release
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          component: mobile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

      - name: Keep rehearsal checksum sentinel
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-sums-mobile
          path: release-assets/SHA256SUMS-mobile.txt
          if-no-files-found: error

      - name: Upload release assets to OSS
        continue-on-error: ${{ needs.changes.outputs.rehearsal == 'false' }}
        uses: ./.github/actions/oss-upload
        with:
          tag: ${{ needs.changes.outputs.tag }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          dry-run: ${{ needs.changes.outputs.rehearsal != 'false' }}

  # ── Release Job 3: 收尾发布（tag 推送与补发都跑，幂等）──
  # 汇总 SHA256SUMS.txt、刷新说明头部（已发布组件 + 服务器/CLI 安装说明）、草稿转正、
  # 决定 latest（稳定版 + 桌面端完整 + 最高稳定版本）。有组件未完成时发布其余组件后
  # 以失败结束并在 job summary 给出补发命令。实现见 .github/scripts/release_publish.py。
  # 演练：同一脚本以 --rehearsal-dir 读取本次的哨兵与说明 artifact，只产出总校验和、release 正文
  # 与计划中的 gh 操作预览（rehearsal-release-preview），不调用任何 gh 写操作。
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        prepare-release,
        build-server-docker,
        upload-app,
        upload-extension,
        upload-server,
        upload-cli,
        upload-mobile,
      ]
    if: ${{ always() && !cancelled() && needs.prepare-release.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download rehearsal sentinels and notes
        if: needs.changes.outputs.rehearsal != 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: rehearsal-*
          path: rehearsal/
          merge-multiple: true

      - name: Publish unified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.changes.outputs.tag }}
          DOCKER_RESULT: ${{ needs.build-server-docker.result }}
          REHEARSAL: ${{ needs.changes.outputs.rehearsal }}
          C_APP: ${{ needs.changes.outputs.app }}
          C_EXTENSION: ${{ needs.changes.outputs.extension }}
          C_SERVER: ${{ needs.changes.outputs.server }}
          C_CLI: ${{ needs.changes.outputs.cli }}
          C_MOBILE: ${{ needs.changes.outputs.mobile }}
        run: |
          EXPECTED=""
          for c in APP EXTENSION SERVER CLI MOBILE; do
            v="C_$c"
            if [ "${!v}" = true ]; then EXPECTED="${EXPECTED:+${EXPECTED},}${c,,}"; fi
          done
          MODE=()
          if [ "$REHEARSAL" != false ]; then MODE=(--rehearsal-dir rehearsal); fi
          python3 .github/scripts/release_publish.py \
            --tag "$TAG" --expected "$EXPECTED" --docker-result "$DOCKER_RESULT" "${MODE[@]}"

      - name: Upload rehearsal release preview
        if: ${{ always() && needs.changes.outputs.rehearsal != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rehearsal-release-preview
          path: |
            rehearsal/SHA256SUMS.txt
            rehearsal/release-body.md
          if-no-files-found: warn

  # ── 最终 Job: 清理 GitHub Actions Artifact，仅保留当前 tag 这一组 ──
  # 原因：Free 账号 artifact 配额仅 500MB，每次 release 会上传 ~400MB
  # Release 资产已独立存储在 GitHub Release，artifact 只是 CI 中间产物可安全清理
  # always()：无论哪些组件被跳过/失败都执行清理，失败不阻断（continue-on-error）
  # 演练不清理：它的 artifact 就是交付物（由下一次真实发布的清理回收）。
  cleanup-artifacts:
    name: Cleanup CI Artifacts
    runs-on: ubuntu-latest
    needs: [changes, publish-release]
    if: ${{ always() && !cancelled() && needs.changes.outputs.rehearsal != 'true' }}

    steps:
      - name: Cleanup GitHub Actions artifacts (keep current tag + in-flight runs)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ needs.changes.outputs.tag }}"
          echo "🧹 Artifact cleanup: keeping artifacts from tag ${CURRENT_TAG} and any still-running workflow runs"

          # 收集所有未完成（queued/in_progress）run 的 id：并行的其他 tag 发布
          # 仍在使用自己的 artifact，绝不能删（曾导致 v0.2.4-rc.1 的 Windows
          # installer 被并行的 v0.2.3 cleanup 提前删除，Release 缺 x64 安装包）
          ACTIVE_RUN_IDS=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?status=in_progress" \
            -q '.workflow_runs[].id'; gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?status=queued" \
            -q '.workflow_runs[].id')
          ACTIVE_JSON=$(printf '%s\n' $ACTIVE_RUN_IDS | jq -cs 'map(tonumber)')
          echo "Active run ids: ${ACTIVE_JSON}"

          # 列出所有 artifact：跳过当前 tag 的、跳过属于未完成 run 的，删除其余
          # workflow_run.head_branch 在 tag 推送时等于 tag 名（v0.1.43 这样）
          DELETE_IDS=$(gh api --paginate \
            repos/${{ github.repository }}/actions/artifacts \
            -q ".artifacts[] | select(.workflow_run.head_branch != \"${CURRENT_TAG}\") | select(.workflow_run.id as \$rid | (${ACTIVE_JSON} | index(\$rid)) == null) | .id")

          if [ -z "$DELETE_IDS" ]; then
            echo "✅ No old artifacts to delete"
            exit 0
          fi

          DELETE_COUNT=$(echo "$DELETE_IDS" | wc -l)
          echo "Will delete ${DELETE_COUNT} old artifact(s)"

          # 串行删除避免触发 GitHub TLS 限流（之前并发 8 大量 timeout）
          FAIL=0
          for id in $DELETE_IDS; do
            if gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/${id} 2>/dev/null; then
              echo "  🗑️  Deleted artifact ${id}"
            else
              echo "  ⚠️  Failed to delete artifact ${id}"
              FAIL=$((FAIL+1))
            fi
          done

          echo "✅ Artifact cleanup complete. Deleted $((DELETE_COUNT-FAIL))/${DELETE_COUNT}"
          if [ "$FAIL" -gt 0 ]; then
            echo "⚠️  ${FAIL} deletion(s) failed (will be retried next release)"
          fi
