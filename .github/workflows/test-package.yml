name: Manual Client Test Packages

# 手动出测试包（不发 Release）。桌面端 = GPUI，打包逻辑与 release.yml 相同
# （Windows 未签名 Inno 安装器 + 便携 zip；Linux scripts/package_gpui_linux.sh；
# macOS scripts/package_gpui_macos.sh，测试包为 ad-hoc 签名、不公证）。
# iOS（原生 mobile/FluxDown）复用 ios-testflight.yml：App Store 签名后直接上传 TestFlight，
# 内部组「Internal」自动可用；IPA 只能经 TestFlight 安装，artifact 里的 IPA / dSYM 仅供排查。
# android-native（原生 mobile/Android）复用 android-package.yml：与正式发布共用原生密钥，artifact 里直接装。
# 原生签名不兼容旧 Flutter APK，不能覆盖安装；all 包含原生 Android 和 iOS。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, tag, or commit to build
        required: true
        default: main
        type: string
      version:
        description: Three-part test version used by platform packages
        required: true
        default: 0.0.1
        type: string
      target:
        description: 要打包的平台
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - windows-arm64
          - linux
          - macos
          - android-native
          - ios
          - extension

permissions:
  contents: read

jobs:
  version:
    name: Resolve test version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean_version: ${{ steps.version.outputs.clean_version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match MAJOR.MINOR.PATCH"
            exit 1
          fi
          # 原生 Android 的 versionCode 由前三段派生，0.0.0 会得到非法的 0（mobile/Android/app/build.gradle.kts）
          if [ "${{ inputs.version }}" = 0.0.0 ] && { [ "${{ inputs.target }}" = all ] || [ "${{ inputs.target }}" = android-native ]; }; then
            echo "version must be greater than 0.0.0 when building android-native"
            exit 1
          fi
      - name: Set version outputs
        id: version
        shell: bash
        run: |
          echo "version=${{ inputs.version }}-manual.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Test Windows (${{ matrix.arch }})
    needs: version
    if: inputs.target == 'all' || startsWith(inputs.target, 'windows')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows-x64' && '[{"arch":"x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || inputs.target == 'windows-arm64' && '[{"arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' || '[{"arch":"x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]') }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-${{ matrix.target }}
          cache-on-failure: true

      - name: Build desktop, agent, daemon and browser relay
        shell: bash
        env:
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then export FLUXCLOUD_BASE_URL="$FLUXCLOUD_BASE_URL_SECRET"; fi
          cargo build --locked --release --target ${{ matrix.target }} \
            -p fluxdown_ui_app -p fluxdown_agent -p fluxdown_daemon -p fluxdown_nmh \
            --features fluxdown_agent/desktop --bins

      - name: Stage binaries with MSVC CRT
        shell: pwsh
        run: |
          $stage = "build\gpui\windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($bin in "fluxdown-desktop", "fluxdown-agent", "fluxdownd", "fluxdown_nmh") {
            Copy-Item "target\${{ matrix.target }}\release\$bin.exe" $stage
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC1*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "MSVC CRT redist for ${{ matrix.arch }} not found" }
          Copy-Item "$($crtDir.FullName)\msvcp140*.dll", "$($crtDir.FullName)\vcruntime140*.dll" $stage -Force

      - name: Build unsigned installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          }
          Copy-Item "installer\windows\ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force
          iscc /DMyAppVersion=${{ needs.version.outputs.version }} /DMyAppArch=${{ matrix.arch }} "/DMySourceDir=$PWD\build\gpui\windows-${{ matrix.arch }}" installer\windows\setup.iss

      - name: Create portable package
        shell: pwsh
        run: |
          $portable = "build\gpui\portable-${{ matrix.arch }}"
          Copy-Item "build\gpui\windows-${{ matrix.arch }}" $portable -Recurse
          New-Item -Path "$portable\portable" -ItemType File -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\flux_down.exe" "$portable\flux_down.exe"
          Compress-Archive -Path "$portable\*" -DestinationPath "build\installer\FluxDown-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip"

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/installer/FluxDown-*-setup.exe
            build/installer/FluxDown-*-portable.zip
          if-no-files-found: error

  build-linux:
    name: Test Linux x64
    needs: version
    if: inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake pkg-config zstd libfuse2 \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libzstd-dev libdbus-1-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Build desktop, agent, daemon and browser relay
        run: |
          cargo build --locked --release \
            -p fluxdown_ui_app -p fluxdown_agent -p fluxdown_daemon -p fluxdown_nmh \
            --features fluxdown_agent/desktop --bins
      - name: Package Linux artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BIN_DIR: target/release
          OUT_DIR: build/installer
        run: |
          wget -qO "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/package_gpui_linux.sh
      - name: Upload Linux test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-linux-${{ github.run_number }}
          path: build/installer/*
          if-no-files-found: error

  build-macos:
    name: Test macOS (${{ matrix.arch }})
    needs: version
    if: inputs.target == 'all' || inputs.target == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script_arch: x86_64
          - arch: arm64
            runner: macos-15
            script_arch: arm64
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-macos-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build and package (ad-hoc signed)
        env:
          ARCHS: ${{ matrix.script_arch }}
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT_PREFIX: FluxDown-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          OUT_DIR: ${{ github.workspace }}/build/installer
        run: scripts/package_gpui_macos.sh
      - name: Upload macOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/installer/*.dmg
            build/installer/*.tar.gz
          if-no-files-found: error

  build-extension:
    name: Test Browser Extensions
    needs: version
    if: inputs.target == 'all' || inputs.target == 'extension'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension packages
        working-directory: fluxDown
        shell: bash
        run: |
          VERSION=${{ needs.version.outputs.clean_version }}
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" package.json
          npm ci
          npm run build
          npm run build:firefox
          mkdir -p ../build/extension
          (cd .output && zip -qr "../../build/extension/FluxDown-${VERSION}-chrome.zip" chrome-mv3)
          npx web-ext build \
            --source-dir .output/firefox-mv2 \
            --artifacts-dir ../build/extension \
            --filename "FluxDown-${VERSION}-firefox.zip" \
            --overwrite-dest
      - name: Upload extension test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-browser-extensions-${{ github.run_number }}
          path: build/extension/*
          if-no-files-found: error

  build-ios:
    name: Test iOS (TestFlight)
    needs: version
    if: inputs.target == 'all' || inputs.target == 'ios'
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      version: ${{ needs.version.outputs.clean_version }}
      whats_new: "测试包 ${{ inputs.ref }} · ${{ needs.version.outputs.version }}"

  build-android-native:
    name: Test Android native APK
    needs: version
    if: inputs.target == 'all' || inputs.target == 'android-native'
    uses: ./.github/workflows/android-package.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      version: ${{ needs.version.outputs.version }}
