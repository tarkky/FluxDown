[package]
name = "fluxdown_engine"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
aes = "0.8"
# librqbit 的 TorrentStorage trait 以 anyhow::Result 为方法签名，实现方必须直接依赖（bt_partfile）。
anyhow = "1.0.104"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "deflate", "zstd"] }
async-trait = "0.1.87"
base64 = "0.22"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
dash-mpd = { version = "0.19", default-features = false }
# 系统标准用户目录（下载目录 = Windows FOLDERID_Downloads / XDG user-dirs），
# 禁止 $HOME 拼接。与 native/cli 同版本。
directories = "6.0.0"
encoding_rs = "0.8"
feed-rs = "2.4"
flate2 = "1"
fluxdown_link = { version = "0.1.0", path = "../link", optional = true }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
m3u8-rs = "6"
md-5 = "0.10"
md4 = "0.10"
rand = "0.9"
# 与 feed-rs 同版本：feed 扩展命名空间（Mikan `<torrent><pubDate>`）的二次扫描。
quick-xml = { version = "0.41", features = ["encoding"] }
regex = "1"
rquickjs = { version = "0.12.1", features = ["full-async", "parallel"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["derive", "runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "any"] }
suppaftp = { version = "6", default-features = false }
thiserror = "2.0"
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
ts2mp4 = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# 插件 zip 安装（跨桌面/服务端；仅 plugins feature 开启时启用）
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
fs2 = "0.4.3"
fluxdown_logfile = { version = "0.1.0", path = "../logfile" }

[target."cfg(windows)".dependencies]
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
reqwest = { version = "0.12", features = ["stream", "native-tls", "cookies", "json", "socks"] }
# 固定 0.59：0.61 引入 windows-link(raw-dylib)，与 cdylib 构建在 CI 上不兼容
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
winreg = "0.55"

[target."cfg(not(windows))".dependencies]
libc = "0.2"
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
# native roots 保留 Linux/macOS 的本地 CA；bundled WebPKI roots 为 Android/iOS
# 提供公共 CA 兜底，避免系统证书探测返回空库时所有 HTTPS 请求 UnknownIssuer。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "cookies", "json", "socks", "charset", "http2", "system-proxy", "macos-system-configuration"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
if-addrs = "0.15"

[dev-dependencies]
http = "1.4.0"

[features]
# 默认关闭；desktop/server 构建显式开启，mobile（Android/iOS）保持关闭以免背 JS 引擎债。
plugins = ["dep:rquickjs", "dep:zip"]
# 组件托管安装（ffmpeg 下载/解压）；desktop/server 开启，mobile/CLI 关闭。
components = ["dep:zip"]
# 冻结的 native/server 使用的引擎数据库存储后端（`link::DbLinkStorage`）。
# 当前 agent 的互联状态独立持久化；保留此 feature 以维持旧 server 的源码契约。
link = ["dep:fluxdown_link"]
